<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css" type="text/css" media="all">
  <script src="script.js" charset="utf-8"></script>
  <title>Calculadora</title>
</head>

<body>
  <header>
    <h1>Calculadora</h1>
  </header>
  <main>
    <div id="calc">
      <textarea name="display" id="display" cols="1">67</textarea>
      <div class="calc-row">
        <button class="command" id="clear">C</button>
        <button class="command" id="erase">X</button>
        <button class="operation" id="percentage">%</button>
        <button class="operation" id="division">/</button>
      </div>
      <div class="calc-row">
        <button class="number" id="7">7</button>
        <button class="number" id="8">8</button>
        <button class="number" id="9">9</button>
        <button class="operation" id="times">x</button>
      </div>
      <div class="calc-row">
        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="operation">-</button>
      </div>
      <div class="calc-row">
        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>
        <button class="operation">+</button>
      </div>
      <div class="calc-row">
        <button class="symbol">()</button>
        <button class="number">0</button>
        <button class="symbol">,</button>
        <button class="operation">=</button>
      </div>
    </div>
  </main>
</body>
